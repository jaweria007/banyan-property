<!--
  opportunities.html
  data-page="opportunities"   (script.js dispatches on this)
  replaces staging route: /opportunities

  This is the page content only — no <html>, <head>, sidebar or topbar.
  Drop it inside your app shell and convert to JSX:
    class= -> className=   for= -> htmlFor=   self-close <img> <input> <br>
-->

        <section class="page-head">
          <div>
            <h1 class="page-title">Opportunities <span class="page-count" id="oppCount">16</span></h1>
            <p class="page-subtitle">Every lead, contact and deal across your pipeline.</p>
          </div>
          <div class="page-head__actions">
            <a href="#" class="btn btn-primary" id="newOppBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              New Opportunity
            </a>
          </div>
        </section>

        <!-- Actions Overview — the visual guide the team works from.
             Statuses are derived from the tasks linked to each Opportunity. -->
        <section class="queue-stats" aria-label="Actions overview">
          <button type="button" class="queue-stat is-active" data-action="all">
            <span class="queue-stat__value">16</span>
            <span class="queue-stat__label">All</span>
          </button>
          <button type="button" class="queue-stat" data-action="needs">
            <span class="queue-stat__value queue-stat__value--amber">5</span>
            <span class="queue-stat__label"><span class="action-dot action-dot--orange"></span>Needs Action</span>
          </button>
          <button type="button" class="queue-stat" data-action="waiting">
            <span class="queue-stat__value queue-stat__value--green">4</span>
            <span class="queue-stat__label"><span class="action-dot action-dot--green"></span>Waiting</span>
          </button>
          <button type="button" class="queue-stat" data-action="overdue">
            <span class="queue-stat__value queue-stat__value--red">3</span>
            <span class="queue-stat__label"><span class="action-dot action-dot--red"></span>Overdue</span>
          </button>
          <button type="button" class="queue-stat" data-action="triage">
            <span class="queue-stat__value queue-stat__value--amber">2</span>
            <span class="queue-stat__label"><span class="action-dot action-dot--yellow"></span>Triage</span>
          </button>
          <button type="button" class="queue-stat" data-action="none">
            <span class="queue-stat__value">2</span>
            <span class="queue-stat__label"><span class="action-dot action-dot--none"></span>No Action</span>
          </button>
        </section>

        <!-- Only search + Channel remain up here; everything else is now a sortable column -->
        <div class="work-bar">
          <label class="search-field search-field--wide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" id="oppSearch" placeholder="Search name, phone or email…" aria-label="Search opportunities">
          </label>
          <div class="work-filters">
            <label class="select-wrap">
              <span class="sr-only">Filter by channel</span>
              <select class="select-field" id="channelSelect">
                <option value="all">All channels</option>
                <option value="Website">Website</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Referral">Referral</option>
                <option value="Scout">Scout</option>
                <option value="Walk-in">Walk-in</option>
              </select>
            </label>
            <button type="button" class="btn btn-ghost" id="oppResetBtn">Reset</button>
          </div>
        </div>

        <section class="work-list" aria-label="Opportunity list">
          <table class="data-table opp-grid">
            <thead>
              <tr>
                <th scope="col" class="th-sort" data-sort="name">Name</th>
                <th scope="col" class="th-sort" data-sort="action">Action</th>
                <th scope="col" class="th-sort" data-sort="stage">Stage</th>
                <th scope="col" class="th-sort" data-sort="type">Type</th>
                <th scope="col" class="th-sort" data-sort="channel">Channel</th>
                <th scope="col" class="th-sort" data-sort="priority">Priority</th>
                <th scope="col" class="th-sort" data-sort="agent">Agent</th>
                <th scope="col" class="th-sort" data-sort="updated">Last Updated</th>
                <th scope="col" class="th-sort is-asc" data-sort="shortlist">Shortlist</th>
                <th scope="col" class="th-edit">Edit</th>
              </tr>
            </thead>
            <tbody id="oppBody"></tbody>
          </table>
          <p class="list-empty" id="oppEmpty" hidden>No opportunities match your filters.</p>
        </section>

      

<!-- ===== drawers / modals belonging to this page ===== -->
<!-- New Opportunity -->
      <button class="drawer-backdrop" id="oppBackdrop" aria-label="Close" hidden></button>
      <aside class="drawer" id="oppDrawer" aria-labelledby="oppDrawerTitle" aria-hidden="true">
        <header class="drawer__head">
          <h2 class="drawer__title" id="oppDrawerTitle">New Opportunity</h2>
          <button type="button" class="icon-btn drawer__close" id="oppDrawerClose" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </header>

        <div class="drawer__body">
          <section class="drawer-group">
            <h3 class="drawer-group__title">Client</h3>
            <label class="field">
              <span class="field__label">Name</span>
              <input type="text" class="input-field" id="noName" placeholder="Full name">
            </label>
            <div class="drawer-row drawer-row--2">
              <label class="field">
                <span class="field__label">WhatsApp</span>
                <input type="tel" class="input-field" id="noPhone" placeholder="+62 …">
              </label>
              <label class="field">
                <span class="field__label">Email</span>
                <input type="email" class="input-field" id="noEmail" placeholder="name@example.com">
              </label>
            </div>
          </section>

          <section class="drawer-group">
            <h3 class="drawer-group__title">Opportunity</h3>
            <div class="drawer-row drawer-row--2">
              <label class="field">
                <span class="field__label">Channel</span>
                <select class="select-field" id="noChannel">
                  <option value="Website">Website</option>
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Referral">Referral</option>
                  <option value="Scout">Scout</option>
                  <option value="Walk-in">Walk-in</option>
                </select>
              </label>
              <label class="field">
                <span class="field__label">Property Type</span>
                <select class="select-field" id="noType">
                  <option value="Rent">Rent</option>
                  <option value="Villa">Villa</option>
                  <option value="Land">Land</option>
                  <option value="Commercial">Commercial</option>
                </select>
              </label>
            </div>
            <label class="field">
              <span class="field__label">Budget</span>
              <input type="text" class="input-field" id="noBudget" placeholder="e.g. IDR 20m–50m per year, or USD 350k">
            </label>
          </section>

          <section class="drawer-group">
            <h3 class="drawer-group__title">Target Renter <span class="field-hint">(optional)</span></h3>
            <div class="tagset">
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Budget Home (10-20m)"><span>Budget Home (10–20m)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Lifestyle Home (20-35m)"><span>Lifestyle Home (20–35m)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Premium Home (35-60m)"><span>Premium Home (35–60m)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Executive Home (60m+)"><span>Executive Home (60m+)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Perfect Home (Challenging Requirement)"><span>Perfect Home (Challenging Requirement)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetRenter" value="Fit for Pets"><span>Fit for Pets</span></label>
            </div>
          </section>

          <section class="drawer-group">
            <h3 class="drawer-group__title">Target Buyer <span class="field-hint">(optional)</span></h3>
            <div class="tagset">
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Family &amp; Lifestyle"><span>Family &amp; Lifestyle</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Investor (Passive Income)"><span>Investor (Passive Income)</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Retiree"><span>Retiree</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Property Developer"><span>Property Developer</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Land Banker"><span>Land Banker</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Fix &amp; Flip"><span>Fix &amp; Flip</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Fix &amp; Live"><span>Fix &amp; Live</span></label>
              <label class="tag-check"><input type="checkbox" name="targetBuyer" value="Collector (No ROI)"><span>Collector (No ROI)</span></label>
            </div>
          </section>

          <label class="field">
            <span class="field__label">Client Requirements</span>
            <textarea class="input-field input-field--area" id="noReq" rows="4" placeholder="In the client's own words — what are they looking for?"></textarea>
          </label>
        </div>

        <footer class="drawer__foot">
          <button type="button" class="btn btn-ghost" id="noCancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="noSave">Create Opportunity</button>
        </footer>
      </aside>
