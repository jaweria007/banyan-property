<!--
  availability.html
  data-page="availability"   (script.js dispatches on this)
  replaces staging route: /master/availability

  This is the page content only — no <html>, <head>, sidebar or topbar.
  Drop it inside your app shell and convert to JSX:
    class= -> className=   for= -> htmlFor=   self-close <img> <input> <br>
-->

        <section class="page-head">
          <div>
            <h1 class="page-title">Availability</h1>
            <p class="page-subtitle">Portfolio-wide lease expiries and upcoming availability.</p>
          </div>
        </section>

        <section class="avail-grid" aria-label="Availability overview">

          <article class="avail-card">
            <div class="avail-card__head">
              <span class="avail-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              </span>
              <h2 class="avail-card__title">Upcoming Lease Events</h2>
              <span class="avail-card__count" id="leaseCount">0</span>
            </div>

            <div class="filter-tabs" role="group" aria-label="Filter lease events">
              <button type="button" class="filter-tab is-active" data-filter="all">All</button>
              <button type="button" class="filter-tab" data-filter="7">Next 7 days</button>
              <button type="button" class="filter-tab" data-filter="30">Next 30 days</button>
              <button type="button" class="filter-tab" data-filter="60">Next 60 days</button>
              <button type="button" class="filter-tab" data-filter="expired">Expired</button>
            </div>

            <div class="avail-body" id="leaseEvents">
              <p class="avail-empty">No lease events match.</p>
            </div>
          </article>

          <article class="avail-card">
            <div class="avail-card__head">
              <span class="avail-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
              </span>
              <h2 class="avail-card__title">Current Availability</h2>
              <span class="avail-card__count" id="currentCount">0</span>
            </div>

            <div class="avail-body">
              <p class="avail-empty">Nothing currently available.</p>
            </div>
          </article>

          <article class="avail-card">
            <div class="avail-card__head">
              <span class="avail-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              </span>
              <h2 class="avail-card__title">Future Availability</h2>
              <span class="avail-card__count" id="futureCount">0</span>
            </div>

            <div class="avail-body">
              <p class="avail-empty">No upcoming availability.</p>
            </div>
          </article>

        </section>

        <section class="card cal-card">
          <div class="cal-head">
            <div class="cal-nav">
              <button type="button" class="icon-btn" id="prevMonth" aria-label="Previous month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button type="button" class="icon-btn" id="nextMonth" aria-label="Next month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <h2 class="cal-month" id="calMonth">August 2026</h2>
              <span class="cal-today" id="todayLabel">Today · Sat, Aug 7</span>
            </div>
            <div class="seg" role="group" aria-label="Calendar view">
              <button type="button" class="seg__btn is-active" data-view="month">Month</button>
              <button type="button" class="seg__btn" data-view="week">Week</button>
            </div>
          </div>
          <div class="cal-body" id="calBody" aria-live="polite"></div>
        </section>
      

<!-- ===== drawers / modals belonging to this page ===== -->
<div class="modal-overlay" id="dayModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
      <div class="modal__head">
        <h3 class="modal__title" id="dayModalTitle">August 2, 2026</h3>
        <button type="button" class="modal__close" id="dayModalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal__body" id="dayModalBody"></div>
    </div>
  </div>
