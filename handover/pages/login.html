<!--
  login.html
  data-page="login"   (script.js dispatches on this)
  replaces staging route: /login

  This is the page content only — no <html>, <head>, sidebar or topbar.
  Drop it inside your app shell and convert to JSX:
    class= -> className=   for= -> htmlFor=   self-close <img> <input> <br>
-->

    <img class="login-logo" src="public/banyan logo.png" alt="Banyan Properties">

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to manage your listings dashboard.</p>

    <form class="login-form" id="loginForm" novalidate>
      <p class="login-error" id="loginError" role="alert"></p>

      <div class="login-field">
        <label class="login-label" for="loginEmail">Email address</label>
        <input class="login-input" type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="login-field">
        <label class="login-label" for="loginPassword">Password</label>
        <div class="login-input-wrap">
          <input class="login-input" type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="login-eye" id="togglePassword" aria-label="Show or hide password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
    </form>
