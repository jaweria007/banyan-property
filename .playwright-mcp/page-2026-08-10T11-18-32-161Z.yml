          - generic [ref=f10e392]:
            - generic [ref=f10e393]: Marketplace | Why choose the Canggu, Kuta, Tanah Lot corridor?
            - textbox [ref=f10e394]: "**Surf, Lifestyle & Strong Rental Yields Await.** **Canggu area** is a vibrant **coastal village** with booming real estate, drawing expats, surfers, and digital nomads. Demand is rising for **quality villas** and **long-term rentals**. With increasing supply and **stable prices**, now is the ideal time to invest in **Canggu** property."
          - generic [ref=f10e395]:
            - generic [ref=f10e396]: Marketplace | Why choose the Canggu, Kuta, Tanah Lot corridor? | Description
